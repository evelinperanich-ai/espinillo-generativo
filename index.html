<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humedal y Espinillo</title>
    <style>
        /* ==========================================
           RESET Y ESTILOS GLOBALES
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Lienzo interactivo a pantalla completa */
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ==========================================
           INTERFAZ MINIMALISTA
           ========================================== */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Deja pasar clics al canvas si es necesario */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }

        /* Contenedor Superior (Audio) */
        .top-container {
            display: flex;
            justify-content: flex-end;
            pointer-events: auto;
        }

        /* Botón de Música Discreto */
        #btn-musica {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #btn-musica:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Contenedor Inferior (Input) */
        .bottom-container {
            display: flex;
            justify-content: center;
            pointer-events: auto;
            margin-bottom: 20px;
        }

        /* Input Invisible / Minimalista */
        #input-respuesta {
            width: 100%;
            max-width: 600px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-size: 1.5rem;
            text-align: center;
            padding: 15px 10px;
            outline: none;
            font-weight: 300;
            transition: border-color 0.4s, text-shadow 0.4s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #input-respuesta::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }

        #input-respuesta:focus {
            border-bottom-color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        /* Contenedor oculto para el reproductor de YouTube */
        #youtube-container {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Lienzo Generativo -->
    <canvas id="canvas"></canvas>

    <!-- Capa de Interfaz de Usuario -->
    <div class="ui-layer">
        
        <div class="top-container">
            <button id="btn-musica">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                Escuchar 'Jangadero'
            </button>
        </div>

        <div class="bottom-container">
            <input type="text" id="input-respuesta" placeholder="Escribe tu reflejo y presiona Enter..." autocomplete="off">
        </div>

    </div>

    <!-- Contenedor del Reproductor -->
    <div id="youtube-container"></div>

    <script>
        /**
         * ======================================================================
         * MOTOR GENERATIVO DEL HUMEDAL Y ESPINILLO
         * ======================================================================
         */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let time = 0;

        // Estructuras de datos estáticas para evitar recalcular en cada frame
        let landscape = {
            reeds: []
        };
        
        let tree = {
            segments: [],
            thorns: [],
            leaves: [],
            nodes: [] // Puntos donde pueden florecer los espinillos
        };

        // Arreglos dinámicos (Elementos animados)
        let flowers = [];
        let floatingTexts = [];

        // Inicializar tamaño del lienzo
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Regenerar arte procedural al cambiar el tamaño
            generateLandscape();
            generateTree();
        }

        window.addEventListener('resize', resize);

        /**
         * 1. GENERACIÓN PROCEDURAL DEL HUMEDAL
         */
        function generateLandscape() {
            landscape.reeds = [];
            const numReeds = width / 4; // Densidad de juncos/totoras basada en el ancho
            const waterLevel = height * 0.65; // Nivel del agua
            
            for (let i = 0; i < numReeds; i++) {
                // Generar juncos con variaciones orgánicas
                let x = Math.random() * width;
                let h = height * 0.15 + Math.random() * height * 0.25;
                let widthThickness = 1 + Math.random() * 2;
                
                // Colores otoñales/verdosos desaturados típicos del humedal
                let isCortaderia = Math.random() > 0.85; // Algunos son plumerillos
                let hue = isCortaderia ? (40 + Math.random() * 20) : (60 + Math.random() * 40);
                let sat = 20 + Math.random() * 30;
                let lit = 30 + Math.random() * 30;
                let color = `hsl(${hue}, ${sat}%, ${lit}%)`;

                landscape.reeds.push({
                    x: x,
                    baseY: height,
                    height: h,
                    width: widthThickness,
                    swayOffset: Math.random() * Math.PI * 2, // Desfase para animación de viento
                    swaySpeed: 0.005 + Math.random() * 0.01,
                    color: color,
                    isCortaderia: isCortaderia
                });
            }
        }

        /**
         * 2. GENERACIÓN PROCEDURAL DEL ESPINILLO (Vachelia caven)
         * Ramas tortuosas oscuras, espinas blancas en V, hojas bipinnadas.
         */
        function generateTree() {
            tree.segments = [];
            tree.thorns = [];
            tree.leaves = [];
            tree.nodes = [];

            let currentX = -20; // Empieza ligeramente fuera del borde izquierdo
            let currentY = height * 0.5;
            let currentThickness = Math.min(width * 0.03, 30); // Grosor inicial
            
            const numSegments = 25;
            const branchLength = (width * 0.6) / numSegments;
            
            let currentAngle = -0.1; // Ligeramente hacia arriba

            for (let i = 0; i < numSegments; i++) {
                // Comportamiento tortuoso: cambios de ángulo aleatorios
                currentAngle += (Math.random() - 0.4) * 0.6;
                
                let nextX = currentX + Math.cos(currentAngle) * branchLength;
                let nextY = currentY + Math.sin(currentAngle) * branchLength;

                tree.segments.push({
                    x1: currentX, y1: currentY, 
                    x2: nextX, y2: nextY, 
                    w: currentThickness
                });

                // Cada cierto tramo, creamos un "Nudo" botánico
                if (i > 3 && i % 2 === 0) {
                    tree.nodes.push({ x: nextX, y: nextY });

                    // A) Espinas en Par (V-shape) típicas del espinillo
                    let thornLength = 20 + Math.random() * 25;
                    tree.thorns.push({
                        x: nextX, y: nextY,
                        angle: currentAngle - 0.8 - Math.random() * 0.3, // Espina hacia arriba/atrás
                        length: thornLength
                    });
                    tree.thorns.push({
                        x: nextX, y: nextY,
                        angle: currentAngle + 0.8 + Math.random() * 0.3, // Espina hacia abajo/adelante
                        length: thornLength * (0.8 + Math.random()*0.4)
                    });

                    // B) Hojas bipinnadas (pequeñas y febriles)
                    if (Math.random() > 0.3) {
                        tree.leaves.push({
                            x: nextX, y: nextY,
                            angle: currentAngle + (Math.random() > 0.5 ? 1 : -1) * 1.5,
                            length: 30 + Math.random() * 30
                        });
                    }
                }

                currentX = nextX;
                currentY = nextY;
                currentThickness *= 0.88; // La rama se afina gradualmente
            }
        }

        /**
         * CLASES DINÁMICAS (Interactividad)
         */

        // Floración realista de pompones amarillos
        class Flower {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.targetRadius = 15 + Math.random() * 10;
                this.currentRadius = 0;
                this.filaments = [];
                
                // Generar cientos de estambres radiales
                for (let i = 0; i < 200; i++) {
                    this.filaments.push({
                        angle: Math.random() * Math.PI * 2,
                        lengthRatio: 0.2 + Math.random() * 0.8, // Relativo al radio total
                        color: Math.random() > 0.3 ? '#FFD700' : '#FFA500' // Oro y Naranja
                    });
                }
            }

            update() {
                // Animación de crecimiento elástico (ease-out)
                let diff = this.targetRadius - this.currentRadius;
                this.currentRadius += diff * 0.08;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.currentRadius, this.currentRadius);
                
                // Dibujar centro oscuro tenue
                ctx.beginPath();
                ctx.arc(0, 0, 0.2, 0, Math.PI * 2);
                ctx.fillStyle = '#8B6508';
                ctx.fill();

                // Dibujar filamentos
                ctx.lineWidth = 0.05;
                for (let f of this.filaments) {
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(f.angle) * f.lengthRatio, Math.sin(f.angle) * f.lengthRatio);
                    ctx.strokeStyle = f.color;
                    ctx.stroke();
                    
                    // Pequeña antera en la punta
                    ctx.beginPath();
                    ctx.arc(Math.cos(f.angle) * f.lengthRatio, Math.sin(f.angle) * f.lengthRatio, 0.04, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFF8DC'; // Color polen
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Textos Flotantes (Efecto Panadero / Dandelion)
        class FloatingText {
            constructor(text, x, y) {
                this.text = text;
                this.startX = x;
                this.x = x;
                this.y = y;
                this.opacity = 0; // Inicia invisible, hace fade in
                this.phase = 'in'; // 'in', 'float', 'out'
                
                // Físicas orgánicas
                this.speedY = 0.8 + Math.random() * 1.2;
                this.swayAmplitude = 30 + Math.random() * 40;
                this.swayFrequency = 0.01 + Math.random() * 0.02;
                this.timeOffset = Math.random() * 1000;
            }

            update() {
                // Fade In al nacer
                if (this.phase === 'in') {
                    this.opacity += 0.02;
                    if (this.opacity >= 1) this.phase = 'float';
                }

                // Movimiento hacia arriba y oscilación lateral (Senoidal)
                this.y -= this.speedY;
                this.x = this.startX + Math.sin(time * this.swayFrequency + this.timeOffset) * this.swayAmplitude;

                // Fade Out al llegar arriba
                if (this.y < height * 0.15) {
                    this.phase = 'out';
                    this.opacity -= 0.01;
                }
            }

            draw(ctx) {
                if (this.opacity <= 0) return;
                
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fillStyle = '#ffffff';
                ctx.font = '300 1.6rem "Segoe UI", Arial, sans-serif';
                ctx.textAlign = 'center';
                
                // Sombra suave para legibilidad contra el cielo
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 2;
                
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }


        /**
         * BUCLE PRINCIPAL DE ANIMACIÓN Y RENDERIZADO
         */
        function animate() {
            time++;

            // 1. DIBUJAR FONDO: Cielo (Gradiente Azul a Amarillo pálido)
            let skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, '#7baad3'); // Azul cielo
            skyGrad.addColorStop(0.5, '#e4e2cc'); // Amarillo pálido horizonte
            skyGrad.addColorStop(1, '#a6b198'); // Verde agua oscuro
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            // 2. DIBUJAR FONDO: Agua (Reflejos base)
            const waterLevel = height * 0.65;
            ctx.fillStyle = 'rgba(100, 130, 140, 0.4)';
            ctx.fillRect(0, waterLevel, width, height - waterLevel);

            // 3. DIBUJAR HUMEDAL (Juncos y Totoras)
            ctx.lineWidth = 1;
            for (let reed of landscape.reeds) {
                let sway = Math.sin(time * reed.swaySpeed + reed.swayOffset) * 20; // Viento
                
                ctx.beginPath();
                ctx.moveTo(reed.x, reed.baseY);
                // Curva de Bezier para hacer que se doblen con el viento
                ctx.quadraticCurveTo(reed.x + sway * 0.5, reed.baseY - reed.height * 0.5, reed.x + sway, reed.baseY - reed.height);
                ctx.strokeStyle = reed.color;
                ctx.lineWidth = reed.width;
                ctx.stroke();

                // Dibujar plumerillo blanco en la punta si es cortaderia
                if (reed.isCortaderia) {
                    ctx.fillStyle = 'rgba(240, 240, 235, 0.6)';
                    ctx.beginPath();
                    ctx.ellipse(reed.x + sway, reed.baseY - reed.height, 4, 15, Math.sin(time*0.01), 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // 4. DIBUJAR ÁRBOL: Ramas de Espinillo
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            for (let seg of tree.segments) {
                ctx.beginPath();
                ctx.moveTo(seg.x1, seg.y1);
                ctx.lineTo(seg.x2, seg.y2);
                ctx.strokeStyle = '#2d241c'; // Madera oscura
                ctx.lineWidth = seg.w;
                ctx.stroke();
            }

            // 4. DIBUJAR ÁRBOL: Espinas
            for (let thorn of tree.thorns) {
                ctx.beginPath();
                ctx.moveTo(thorn.x, thorn.y);
                ctx.lineTo(thorn.x + Math.cos(thorn.angle) * thorn.length, thorn.y + Math.sin(thorn.angle) * thorn.length);
                ctx.strokeStyle = '#e0e0e0'; // Blanco/Grisáceo
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // 4. DIBUJAR ÁRBOL: Hojas (Bipinnadas abstractas)
            ctx.strokeStyle = '#5a7049'; // Verde tenue
            for (let leaf of tree.leaves) {
                ctx.beginPath();
                ctx.moveTo(leaf.x, leaf.y);
                let endX = leaf.x + Math.cos(leaf.angle) * leaf.length;
                let endY = leaf.y + Math.sin(leaf.angle) * leaf.length;
                ctx.lineTo(endX, endY);
                ctx.lineWidth = 1;
                ctx.stroke();
                
                // Pequeñas hojuelas perpendiculares
                for(let j=0.2; j<1; j+=0.15) {
                    let px = leaf.x + Math.cos(leaf.angle) * leaf.length * j;
                    let py = leaf.y + Math.sin(leaf.angle) * leaf.length * j;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(px + Math.cos(leaf.angle + 1.5) * 5, py + Math.sin(leaf.angle + 1.5) * 5);
                    ctx.moveTo(px, py);
                    ctx.lineTo(px + Math.cos(leaf.angle - 1.5) * 5, py + Math.sin(leaf.angle - 1.5) * 5);
                    ctx.stroke();
                }
            }

            // 5. ACTUALIZAR Y DIBUJAR FLORES
            for (let flower of flowers) {
                flower.update();
                flower.draw(ctx);
            }

            // 6. ACTUALIZAR Y DIBUJAR TEXTOS (Panaderos)
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let fText = floatingTexts[i];
                fText.update();
                fText.draw(ctx);
                // Limpieza de memoria
                if (fText.opacity <= 0 && fText.phase === 'out') {
                    floatingTexts.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        /**
         * EVENTOS E INTERACCIONES
         */

        const inputRespuesta = document.getElementById('input-respuesta');
        const btnMusica = document.getElementById('btn-musica');
        const ytContainer = document.getElementById('youtube-container');
        let musicaActiva = false;

        // Auto-focus al iniciar
        window.onload = function() {
            resize();
            animate(); // Iniciar bucle de renderizado
            inputRespuesta.focus();
        };

        // Escuchar Enter para la mecánica de floración
        inputRespuesta.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const texto = inputRespuesta.value.trim();
                if (texto !== '') {
                    // Seleccionar un nodo aleatorio del árbol
                    const randomNode = tree.nodes[Math.floor(Math.random() * tree.nodes.length)];
                    
                    // Crear Flor (Pompón) en el nodo
                    flowers.push(new Flower(randomNode.x, randomNode.y));
                    
                    // Crear Texto Flotante (Panadero) emergiendo de la flor
                    floatingTexts.push(new FloatingText(texto, randomNode.x, randomNode.y));
                    
                    // Limpiar el campo
                    inputRespuesta.value = '';
                }
            }
        });

        // Asegurar que el input mantenga el foco al hacer clic en el lienzo
        canvas.addEventListener('click', () => inputRespuesta.focus());

        // Lógica de Audio (Jangadero - Milo J, Mercedes Sosa)
        btnMusica.addEventListener('click', function() {
            if (!musicaActiva) {
                // Inyectar Iframe de YouTube (ID: 8GU0Yal4ysI)
                ytContainer.innerHTML = `
                    <iframe 
                        width="10" height="10" 
                        src="https://www.youtube.com/embed/8GU0Yal4ysI?autoplay=1&loop=1&playlist=8GU0Yal4ysI" 
                        frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
                    </iframe>
                `;
                btnMusica.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>
                    Música Sonando
                `;
                btnMusica.style.borderColor = 'rgba(255,255,255,0.8)';
                musicaActiva = true;
            }
        });

    </script>
</body>
</html>
