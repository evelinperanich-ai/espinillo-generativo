<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espinillo Generativo y Panaderos</title>
  
  <!-- Importamos la fuente Lexend desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* CSS: Estilos de la página */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Lexend', sans-serif; /* Aplicamos la fuente Lexend al proyecto */
      background-color: #1a1a1a;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .interfaz {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      padding: 15px 25px;
      border-radius: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      align-items: center;
    }

    /* Mejora de Contraste en la caja de texto */
    input[type="text"] {
      border: 2px solid #333; /* Borde oscuro para resaltar */
      background: rgba(255, 255, 255, 0.95); /* Fondo casi blanco sólido */
      outline: none;
      font-size: 1.2rem;
      color: #000000; /* Letra Negra */
      width: 250px;
      font-weight: 600;
      font-family: 'Lexend', sans-serif;
      padding: 8px 15px;
      border-radius: 20px;
    }
    
    input[type="text"]::placeholder {
      color: #555555; /* Placeholder oscuro para leer mejor */
    }

    button {
      background: #F1C40F;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Lexend', sans-serif;
    }

    button:hover {
      background: #F39C12;
      transform: scale(1.05);
    }

    /* Botón DUA para escuchar */
    .btn-escuchar {
      background: #3498db;
      color: white;
      padding: 10px;
      border-radius: 50%;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-escuchar:hover {
      background: #2980b9;
    }

    /* Controles de música separados */
    .controles-musica {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
    }

    .btn-musica {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(5px);
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      color: #333;
      border: 1px solid #999;
    }
  </style>
</head>
<body>

  <!-- Iframe oculto de YouTube -->
  <iframe id="reproductor" width="0" height="0" src="https://www.youtube.com/embed/PkU5_6_KGps?enablejsapi=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>
  
  <div class="controles-musica">
    <button class="btn-musica" onclick="reproducirMusica()">▶️ Play</button>
    <button class="btn-musica" onclick="pausarMusica()">⏹️ Stop</button>
  </div>

  <canvas id="miCanvas"></canvas>

  <div class="interfaz">
    <input type="text" id="entradaPalabra" placeholder="Escribe tu reflexión..." autocomplete="off">
    <button onclick="enviarRespuesta()">Florecer</button>
    <!-- Botón DUA -->
    <button class="btn-escuchar" onclick="leerRespuestasVoz()" title="Escuchar todas las respuestas">🔊</button>
  </div>

  <script>
    const canvas = document.getElementById('miCanvas');
    const ctx = canvas.getContext('2d');
    
    function redimensionar() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', redimensionar);
    redimensionar();

    let flores = [];
    let palabrasFlotantes = [];
    let tiempo = 0;

    function dibujarRama(startX, startY, length, angle, depth) {
      if (depth === 0) return; 
      const endX = startX + length * Math.cos(angle);
      const endY = startY + length * Math.sin(angle);
      
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.lineWidth = depth * 1.5;
      ctx.strokeStyle = '#3e2723'; 
      ctx.stroke();

      if (depth < 4) {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX + 15 * Math.cos(angle + 0.5), startY + 15 * Math.sin(angle + 0.5));
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX + 15 * Math.cos(angle - 0.5), startY + 15 * Math.sin(angle - 0.5));
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#d7ccc8'; 
        ctx.stroke();
      }

      dibujarRama(endX, endY, length * 0.7, angle - 0.3, depth - 1);
      dibujarRama(endX, endY, length * 0.7, angle + 0.4, depth - 1);
    }

    function crearFlor() {
      const x = canvas.width * 0.3 + Math.random() * (canvas.width * 0.4);
      const y = canvas.height * 0.2 + Math.random() * (canvas.height * 0.3);
      flores.push({ x: x, y: y, radio: 0, maxRadio: 12 + Math.random() * 8 });
    }

    function cargarRespuestas() {
      try {
        const guardadas = JSON.parse(localStorage.getItem('espinillo_generativo')) || [];
        guardadas.forEach(texto => {
          crearFlor(); 
        });
      } catch(e) { console.log(e); }
    }

    function guardarRespuesta(texto) {
      try {
        const guardadas = JSON.parse(localStorage.getItem('espinillo_generativo')) || [];
        guardadas.push(texto);
        localStorage.setItem('espinillo_generativo', JSON.stringify(guardadas));
      } catch(e) { console.log(e); }
    }

    function enviarRespuesta() {
      const input = document.getElementById('entradaPalabra');
      const texto = input.value.trim();
      
      if (texto !== "") {
        crearFlor();
        guardarRespuesta(texto); // Guardamos la palabra
        
        palabrasFlotantes.push({
          texto: texto,
          x: canvas.width / 2,
          y: canvas.height - 120,
          velY: -(1 + Math.random() * 1.5), 
          faseX: Math.random() * Math.PI * 2 
        });
        
        input.value = ""; 
      }
    }

    document.getElementById('entradaPalabra').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') enviarRespuesta();
    });

    function animar() {
      tiempo += 0.02;

      const cielo = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
      cielo.addColorStop(0, '#5D9CEC');
      cielo.addColorStop(1, '#F6E58D');
      ctx.fillStyle = cielo;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const agua = ctx.createLinearGradient(0, canvas.height * 0.6, 0, canvas.height);
      agua.addColorStop(0, '#48C9B0');
      agua.addColorStop(1, '#2C3E50');
      ctx.fillStyle = agua;
      ctx.fillRect(0, canvas.height * 0.6, canvas.width, canvas.height * 0.4);

      ctx.strokeStyle = '#2d3436';
      ctx.lineWidth = 2;
      for (let i = 0; i < canvas.width; i += 20) {
        ctx.beginPath();
        ctx.moveTo(i, canvas.height);
        const brisa = Math.sin(tiempo + i * 0.1) * 25; 
        ctx.quadraticCurveTo(i, canvas.height - 60, i + brisa, canvas.height - 120 - (i % 40));
        ctx.stroke();
      }

      dibujarRama(canvas.width / 2, canvas.height * 0.7, canvas.height * 0.2, -Math.PI / 2, 5);

      flores.forEach(flor => {
        if (flor.radio < flor.maxRadio) flor.radio += 0.3; 
        
        for(let i = 0; i < 20; i++) {
            ctx.beginPath();
            ctx.moveTo(flor.x, flor.y);
            let ang = Math.random() * Math.PI * 2;
            let dist = Math.random() * flor.radio;
            ctx.lineTo(flor.x + Math.cos(ang) * dist, flor.y + Math.sin(ang) * dist);
            ctx.strokeStyle = "#F1C40F";
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        ctx.beginPath();
        ctx.arc(flor.x, flor.y, flor.radio * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(241, 196, 15, 0.8)";
        ctx.fill();
      });

      ctx.font = "26px 'Lexend', sans-serif"; // Actualizado a Lexend
      ctx.fillStyle = "#ffffff";
      ctx.shadowBlur = 4;
      ctx.shadowColor = "rgba(0,0,0,0.5)"; 
      
      palabrasFlotantes.forEach((p, i) => {
        p.y += p.velY; 
        p.faseX += 0.03; 
        const xReal = p.x + Math.sin(p.faseX) * 50; 
        
        ctx.fillText(p.texto, xReal - (ctx.measureText(p.texto).width / 2), p.y);

        if (p.y < -50) palabrasFlotantes.splice(i, 1);
      });

      requestAnimationFrame(animar);
    }

    // Funciones de Música mejoradas (Play y Stop separados)
    function reproducirMusica() {
      const iframe = document.getElementById('reproductor');
      iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    }

    function pausarMusica() {
      const iframe = document.getElementById('reproductor');
      iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    }

    // Función DUA: Leer las respuestas en voz alta
    function leerRespuestasVoz() {
      const guardadas = JSON.parse(localStorage.getItem('espinillo_generativo')) || [];
      
      if(guardadas.length === 0) {
        alert("Aún no hay reflexiones para leer.");
        return;
      }

      // Preparamos el texto a leer uniendo todas las palabras
      const texto = "Las reflexiones que han florecido son: " + guardadas.join(". ");
      
      // Usamos el sintetizador de voz nativo del navegador
      const locucion = new SpeechSynthesisUtterance(texto);
      locucion.lang = 'es-ES'; // Idioma español
      locucion.rate = 0.9; // Velocidad un poquito más relajada
      
      window.speechSynthesis.speak(locucion);
    }

    cargarRespuestas();
    animar();
  </script>
</body>
</html>
